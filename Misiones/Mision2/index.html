<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitsu Anime Radar - Async Odyssey</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>API ANIME</h1>
    </header>

    <main>
      <!-- Barra de búsqueda -->
      <form id="search-form" class="search-form">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Buscar anime (ej. Naruto, One Piece)..." 
          autocomplete="off"
        />
        <button type="submit" id="search-btn" class="search-btn">Buscar</button>
      </form>

      <!-- Contenedor para estados (cargando, error, sin resultados) -->
      <div id="status-message" class="status-msg"></div>

      <!-- Métricas y resumen del catálogo (calculadas con reduce) -->
      <div id="stats-info" class="status-msg" style="font-weight: 500; font-size: 15px;"></div>

      <!-- Contenedor del grid de tarjetas -->
      <section id="anime-grid" class="anime-grid"></section>
    </main>
  </div>

  <!-- Enlace al módulo ES orquestador -->
  <script type="module" src="/src/index.js"></script>
</body>
</html>
